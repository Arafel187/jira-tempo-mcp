name: standup-preparation
title: "{{ summary }}"
description: >-
  Подготовка стенда к стендапу.{%- if user_description %} Контекст:
  {{ user_description }}.{% endif %} Создано из шаблона standup-preparation
  {{ today }}.
parent_issuetype: Task
child_issuetype: Sub-task
tasks:
  - tag: "[terraform]"
    summary: "Подготовить IaC-манифесты для нового стенда"
    description: "Создать и проверить Terraform-манифесты для ландшафта «{{ summary }}»."
  - tag: "[terraform]"
    summary: "Проверить план применения IaC и внести правки"
    description: "Прогнать terraform plan для «{{ summary }}», разобрать расхождения и внести правки."
  - tag: "[ansible]"
    summary: "Обновить роли Ansible под новый ландшафт"
    description: "Актуализировать переменные и роли Ansible для стенда «{{ summary }}»."
  - tag: "[ansible]"
    summary: "Отработать прогон Ansible на стенде"
    description: "Выполнить playbook-прогон на «{{ summary }}» и убедиться в идемпотентности."
  - tag: "[jenkins]"
    summary: "Настроить job для сборки стенда"
    description: "Создать и настроить Jenkins job для сборки «{{ summary }}»."
  - tag: "[bitbucket]"
    summary: "Завести репозиторий и права доступа"
    description: "Создать репозиторий в Bitbucket и выдать права команде по «{{ summary }}»."
  - tag: "[helpdesk]"
    summary: "Оформить заявки на доступы"
    description: "Создать заявки в HelpDesk на доступы, необходимые для «{{ summary }}»."
  - tag: "[kubernetes]"
    summary: "Создать namespace и базовые ресурсы"
    description: "Развернуть namespace и базовые манифесты для «{{ summary }}»."
  - tag: "[kubernetes]"
    summary: "Настроить лимиты и квоты namespace"
    description: "Задать ResourceQuota и LimitRange для namespace стенда «{{ summary }}»."
  - tag: "[argocd]"
    summary: "Завести приложение ArgoCD"
    description: "Создать Application в ArgoCD для «{{ summary }}» и проверить синхронизацию."
  - tag: "[hybris]"
    summary: "Подготовить окружение Hybris"
    description: "Настроить окружение Hybris под «{{ summary }}» (конфиги, деплой-параметры)."
  - tag: "[hybris-jenkins]"
    summary: "Настроить пайплайн сборки Hybris"
    description: "Настроить Jenkins-пайплайн сборки Hybris для «{{ summary }}»."
  - tag: "[IMK-Services]"
    summary: "Проверить интеграцию IMK-Services"
    description: "Проверить связность и настройки IMK-Services для «{{ summary }}»."
  - tag: "[стабилизация]"
    summary: "Стабилизировать стенд после развёртывания"
    description: "Проверить работоспособность «{{ summary }}», собрать замечания и стабилизировать."
  - tag: "[тестирование]"
    summary: "Прогнать smoke-тесты на стенде"
    description: "Выполнить smoke-проверки «{{ summary }}» и зафиксировать результаты."