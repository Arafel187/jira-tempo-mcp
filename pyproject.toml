[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-tempo-mcp"
version = "0.5.0"
description = "MCP server for self-hosted Jira + Tempo Timesheets: track time, list worklogs, generate weekly reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Korrnals" }]
keywords = ["mcp", "jira", "tempo", "timesheets", "worklog", "report"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pytz>=2024.1",
    "jinja2>=3.1",  # template engine (v0.2.0)
    "pyyaml>=6.0",  # task templates (parent + child subtasks from YAML)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pytz>=2024.1",
    "types-PyYAML>=6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
jira-tempo-mcp = "jira_tempo_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Built-in task templates (parent + child subtasks from YAML) are package
# data: they must ship inside the wheel for importlib.resources discovery.
[tool.setuptools.package-data]
"jira_tempo_mcp.templates" = ["tasks/*.yaml"]

# NOTE: install.py stays at the project root. It is included in the sdist via
# MANIFEST.in (which also ships .env.example-equivalents and copilot-integration/
# data install.py needs at runtime). install.py is NOT shipped in the wheel:
# it reads PROJECT_ROOT = Path(__file__).resolve().parent and expects the repo
# checkout (.env.example, copilot-integration/, pyproject.toml, .venv/), so
# shipping it alone in a wheel would not make `jira-tempo-mcp install` work.
# A custom build_py cmdclass was attempted (commit 83340d6) but broke isolated
# PEP 517 builds; see commit history for the regression + revert.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

# E501 ignored: long Russian strings (report templates) cannot wrap without breaking
# readability of generated report content; line-length=100 still enforced by ruff format.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]